<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1v1 Arena Shooter</title>
    <style>
        body {
            margin: 0;
            background-color: #222;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background-color: #333;
            border: 4px solid #555;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #ui {
            margin-bottom: 10px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="ui">Player HP: <span id="player-hp">100</span> | Bot HP: <span id="bot-hp">100</span></div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Game State
        let keys = {};
        let mouse = { x: 0, y: 0 };
        let bullets = [];

        // Player Setup
        const player = {
            x: 100,
            y: 300,
            radius: 20,
            color: "#3498db",
            speed: 4,
            hp: 100,
            angle: 0
        };

        // Bot Setup
        const bot = {
            x: 700,
            y: 300,
            radius: 20,
            color: "#e74c3c",
            speed: 2.5,
            hp: 100,
            angle: 0,
            lastShot: 0,
            shootInterval: 800 // ms
        };

        // Event Listeners
        window.addEventListener("keydown", (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false);
        
        canvas.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        canvas.addEventListener("mousedown", () => {
            if (player.hp > 0) {
                shoot(player, mouse.x, mouse.y, "player");
            }
        });

        // Shooting Logic
        function shoot(shooter, targetX, targetY, team) {
            const angle = Math.atan2(targetY - shooter.y, targetX - shooter.x);
            bullets.push({
                x: shooter.x + Math.cos(angle) * shooter.radius,
                y: shooter.y + Math.sin(angle) * shooter.radius,
                vx: Math.cos(angle) * 8,
                vy: Math.sin(angle) * 8,
                radius: 5,
                team: team
            });
        }

        // Update Game Objects
        function update() {
            if (player.hp <= 0 || bot.hp <= 0) return;

            // Player Movement
            if (keys["w"] && player.y > player.radius) player.y -= player.speed;
            if (keys["s"] && player.y < canvas.height - player.radius) player.y += player.speed;
            if (keys["a"] && player.x > player.radius) player.x -= player.speed;
            if (keys["d"] && player.x < canvas.width - player.radius) player.x += player.speed;

            // Player Rotation
            player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

            // Bot AI Logic
            bot.angle = Math.atan2(player.y - bot.y, player.x - bot.x);
            
            // Move Bot closer to player if far, or back away if too close
            const dist = Math.hypot(player.x - bot.x, player.y - bot.y);
            if (dist > 200) {
                bot.x += Math.cos(bot.angle) * bot.speed;
                bot.y += Math.sin(bot.angle) * bot.speed;
            } else if (dist < 100) {
                bot.x -= Math.cos(bot.angle) * bot.speed;
                bot.y -= Math.sin(bot.angle) * bot.speed;
            }

            // Bot Auto-Shoot
            const now = Date.now();
            if (now - bot.lastShot > bot.shootInterval) {
                shoot(bot, player.x, player.y, "bot");
                bot.lastShot = now;
            }

            // Update Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;

                // Wall Collision
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                    continue;
                }

                // Hit Detection Player
                if (b.team === "bot") {
                    if (Math.hypot(b.x - player.x, b.y - player.y)  0) drawEntity(player);
            if (bot.hp > 0) drawEntity(bot);

            // Draw Bullets
            ctx.fillStyle = "#f1c40f";
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.closePath();
            });

            // Game Over Screens
            ctx.font = "40px sans-serif";
            ctx.textAlign = "center";
            if (player.hp <= 0) {
                ctx.fillStyle = "#e74c3c";
                ctx.fillText("GAME OVER - BOT WINS", canvas.width / 2, canvas.height / 2);
            } else if (bot.hp <= 0) {
                ctx.fillStyle = "#2ecc71";
                ctx.fillText("VICTORY - YOU WIN!", canvas.width / 2, canvas.height / 2);
            }
        }

        // Game Loop
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
