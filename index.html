<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1v1 Build Shooter 2D Sandbox</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0b16;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #hud {
            display: flex;
            justify-content: space-between;
            width: 900px;
            margin-bottom: 10px;
            font-weight: bold;
            background: rgba(25, 25, 35, 0.8);
            padding: 10px 20px;
            border-radius: 8px;
            border: 2px solid #3f3f5a;
            box-sizing: border-box;
        }
        canvas {
            background-color: #161624;
            border: 4px solid #3f3f5a;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            cursor: crosshair;
        }
        .bar-bg {
            background: #222;
            width: 150px;
            height: 14px;
            border-radius: 4px;
            display: inline-block;
            overflow: hidden;
            border: 1px solid #444;
            vertical-align: middle;
        }
        .bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.1s ease;
        }
        #hp-fill { background: #ff4757; }
        #mode-indicator { color: #00ffff; }
    </style>
</head>
<body>

    <div id="hud">
        <div>
            HEALTH: <div class="bar-bg"><div id="hp-fill" class="bar-fill"></div></div>
        </div>
        <div>
            MODE: <span id="mode-indicator">🔫 WEAPON (Press E to Toggle)</span>
        </div>
        <div>
            SCORE: <span id="score">0</span>
        </div>
    </div>

    <canvas id="gameCanvas" width="900" height="600"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Game State Variables
        let keys = {};
        let mouse = { x: 0, y: 0 };
        let currentMode = "gun"; // "gun" or "build"
        let playerScore = 0;

        // Entities arrays
        const bullets = [];
        const structures = [];

        // Player setup
        const player = {
            x: 150,
            y: 300,
            radius: 18,
            speed: 4.5,
            hp: 100,
            angle: 0
        };

        // Aggressive Enemy AI setup
        const bot = {
            x: 750,
            y: 300,
            radius: 18,
            speed: 2.8,
            hp: 100,
            angle: 0,
            lastShot: 0,
            shootInterval: 700
        };

        // --- Event Inputs ---
        window.addEventListener("keydown", (e) => {
            keys[e.key.toLowerCase()] = true;
            
            // Fast action item toggles
            if (e.key.toLowerCase() === 'e') {
                currentMode = (currentMode === "gun") ? "build" : "gun";
                document.getElementById("mode-indicator").innerText = 
                    currentMode === "gun" ? "🔫 WEAPON (Press E to Toggle)" : "🧱 WALL BUILD (Press E to Toggle)";
            }
        });
        
        window.addEventListener("keyup", (e) => {
            keys[e.key.toLowerCase()] = false;
        });
        
        canvas.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        canvas.addEventListener("mousedown", (e) => {
            if (player.hp <= 0) return;

            if (currentMode === "gun") {
                // Fire bullet towards mouse coordinates
                const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
                bullets.push({
                    x: player.x + Math.cos(angle) * player.radius,
                    y: player.y + Math.sin(angle) * player.radius,
                    vx: Math.cos(angle) * 9,
                    vy: Math.sin(angle) * 9,
                    owner: "player"
                });
            } else {
                // Modular Grid Snapping build positioning placement
                const snapGridX = Math.floor(mouse.x / 40) * 40;
                const snapGridY = Math.floor(mouse.y / 40) * 40;
                
                // Block placing logic if cell is completely clear
                const exists = structures.some(s => s.x === snapGridX && s.y === snapGridY);
                if (!exists) {
                    structures.push({ x: snapGridX, y: snapGridY, size: 40 });
                }
            }
        });

        // --- Core Loops Engine ---
        function update() {
            if (player.hp <= 0) return;

            // Player position offsets inputs updates
            let nextX = player.x;
            let nextY = player.y;

            if (keys["w"]) nextY -= player.speed;
            if (keys["s"]) nextY += player.speed;
            if (keys["a"]) nextX -= player.speed;
            if (keys["d"]) nextX += player.speed;

            // Simple boundary map wall checks
            if (nextX > player.radius && nextX < canvas.width - player.radius) player.x = nextX;
            if (nextY > player.radius && nextY < canvas.height - player.radius) player.y = nextY;

            // Track continuous mouse rotations angles configurations
            player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

            // --- Aggressive Threat Tracking Bot AI logic updates ---
            bot.angle = Math.atan2(player.y - bot.y, player.x - bot.x);
            
            // Path tracking mechanics targeting the user
            const distanceToPlayer = Math.hypot(player.x - bot.x, player.y - bot.y);
            if (distanceToPlayer > 180) {
                bot.x += Math.cos(bot.angle) * bot.speed;
                bot.y += Math.sin(bot.angle) * bot.speed;
            } else if (distanceToPlayer < 100) {
                bot.x -= Math.cos(bot.angle) * bot.speed;
                bot.y -= Math.sin(bot.angle) * bot.speed;
            }

            // Continuous bot auto weaponry fire schedules
            const now = Date.now();
            if (now - bot.lastShot > bot.shootInterval && bot.hp > 0) {
                bullets.push({
                    x: bot.x + Math.cos(bot.angle) * bot.radius,
                    y: bot.y + Math.sin(bot.angle) * bot.radius,
                    vx: Math.cos(bot.angle) * 6.5,
                    vy: Math.sin(bot.angle) * 6.5,
                    owner: "bot"
                });
                bot.lastShot = now;
            }

            // --- Projectiles Operations and Damage Mapping ---
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;

                // Border bounds wipe checks
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                    continue;
                }

                // Check impacts targets vs built defensive blocks structures
                let hitStructure = false;
                for (let j = structures.length - 1; j >= 0; j--) {
                    let s = structures[j];
                    if (b.x > s.x && b.x < s.x + s.size && b.y > s.y && b.y < s.y + s.size) {
                        structures.splice(j, 1); // Break structural box block down
                        hitStructure = true;
                        break;
                    }
                }
                if (hitStructure) {
                    bullets.splice(i, 1);
                    continue;
                }

                // Entity targeted hits calculations
                if (b.owner === "bot") {
                    if (Math.hypot(b.x - player.x, b.y - player.y) < player.radius) {
                        player.hp -= 20;
                        document.getElementById("hp-fill").style.width = `${Math.max(0, player.hp)}%`;
                        bullets.splice(i, 1);
                        continue;
                    }
                } else if (b.owner === "player") {
                    if (Math.hypot(b.x - bot.x, b.y - bot.y) < bot.radius) {
                        bot.hp -= 25;
                        bullets.splice(i, 1);
                        
                        if (bot.hp <= 0) {
                            playerScore++;
                            document.getElementById("score").innerText = playerScore;
                            // Instant layout respawn updates routines 
                            bot.x = Math.random() * 400 + 450;
                            bot.y = Math.random() * 400 + 100;
                            bot.hp = 100;
                        }
                        continue;
                    }
                }
            }
        }

        // --- Graphics Render Output Methods ---
        function drawEntity(x, y, radius, angle, coreColor) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            // Weapon barrel asset extensions
            ctx.fillStyle = "#555a70";
            ctx.fillRect(0, -5, 28, 10);

            // Unit circular meshes body structures
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fillStyle = coreColor;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#ffffff";
            ctx.stroke();
            ctx.closePath();

            ctx.restore();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Background Arena Grid Accent Highlights Visuals lines
            ctx.strokeStyle = "#1f1f33";
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for (let j = 0; j < canvas.height; j += 40) {
                ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
            }

            // Draw active user structures modular walls map positions
            structures.forEach(s => {
                ctx.fillStyle = "#4b7bec";
                ctx.fillRect(s.x + 2, s.y + 2, s.size - 4, s.size - 4);
                ctx.strokeStyle = "#3867d6";
                ctx.lineWidth = 2;
                ctx.strokeRect(s.x + 2, s.y + 2, s.size - 4, s.size - 4);
            });

            // Draw real-time blueprint placement ghost box if building mode is enabled
            if (currentMode === "build") {
                const ghostX = Math.floor(mouse.x / 40) * 40;
                const ghostY = Math.floor(mouse.y / 40) * 40;
                ctx.fillStyle = "rgba(0, 255, 255, 0.25)";
                ctx.fillRect(ghostX + 2, ghostY + 2, 36, 36);
                ctx.strokeStyle = "#00ffff";
                ctx.strokeRect(ghostX + 2, ghostY + 2, 36, 36);
            }

            // Draw Player and Threat Bot models shapes
            if (player.hp > 0) drawEntity(player.x, player.y, player.radius, player.angle, "#00d2d3");
            if (bot.hp > 0) drawEntity(bot.x, bot.y, bot.radius, bot.angle, "#ff4757");

            // Render live fire traveling projectiles points loops 
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = b.owner === "player" ? "#00ffff" : "#xff4757";
                ctx.fill();
                ctx.closePath();
            });

            // Handle Defeat Game Over overlays masks panels updates
            if (player.hp <= 0) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.font = "bold 40px sans-serif";
                ctx.fillStyle = "#ff4757";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER - BOT ELIMINATED YOU", canvas.width / 2, canvas.height / 2);
                ctx.font = "20px sans-serif";
                ctx.fillStyle = "#ffffff";
                ctx.fillText("Refresh browser page tab to reload sandbox instantly", canvas.width / 2, canvas.height / 2 + 40);
            }
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        // Start the engine loop directly, skipping lock security blockers entirely
        gameLoop();
    </script>
</body>
</html>
