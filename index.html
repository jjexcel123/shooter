<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed 1v1 3D Offline Arena</title>
    <style>
        body { margin: 0; overflow: hidden; background: #060610; font-family: sans-serif; color: white; user-select: none; }
        #hud { position: absolute; top: 15px; left: 15px; background: rgba(15,15,30,0.9); padding: 15px; border-radius: 6px; border: 2px solid #00f5d4; pointer-events: none; line-height: 1.4; font-size: 13px; z-index: 10; }
        #hotbar { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10; }
        .slot { width: 75px; height: 60px; background: rgba(20,20,40,0.9); border: 2px solid #444; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #888; }
        .slot.active { border-color: #00f5d4; color: #fff; background: rgba(0,245,212,0.15); }
        
        /* Mobile/Mouse backup click controls layout */
        #touch-controls { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; z-index: 100; }
        .btn { background: #1e1e38; border: 2px solid #00f5d4; color: white; padding: 12px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn:active { background: #00f5d4; color: black; }
    </style>
</head>
<body>

    <div id="hud">
        <h3 style="margin:0 0 6px 0; color:#00f5d4;">Universal 3D Engine</h3>
        <b>[W, A, S, D]</b> Walk Around<br>
        <b>[Left / Right Arrow]</b> Spin Camera<br>
        <b>[Up / Down Arrow]</b> Tilt View Angle<br>
        <b>[1]</b> Gun Mode &nbsp;|&nbsp; <b>[2]</b> Wall Mode<br>
        <b>[SPACEBAR]</b> Fire Gun / Build Structure
    </div>

    <div id="hotbar">
        <div class="slot active" id="slot-1"><span>🔫</span><br>GUN (1)</div>
        <div class="slot" id="slot-2"><span>🧱</span><br>WALL (2)</div>
    </div>

    <!-- Backup Controls Box: Left-Clicking these works instantly if your keyboard focus drops out -->
    <div id="touch-controls">
        <button class="btn" onmousedown="keys['w']=true" onmouseup="keys['w']=false" onmouseleave="keys['w']=false">FORWARDS (W)</button>
        <button class="btn" onmousedown="keys['arrowleft']=true" onmouseup="keys['arrowleft']=false" onmouseleave="keys['arrowleft']=false">TURN LEFT (←)</button>
        <button class="btn" onmousedown="keys['arrowright']=true" onmouseup="keys['arrowright']=false" onmouseleave="keys['arrowright']=false">TURN RIGHT (→)</button>
        <button class="btn" onclick="executeAction()">FIRE / BUILD (SPACE)</button>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const ctx = canvas.getContext("2d");

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Core Application Engine Matrices ---
        let activeSlot = 1;
        const keys = { w: false, s: false, a: false, d: false, arrowleft: false, arrowright: false, arrowup: false, arrowdown: false };
        
        const player = { x: 0, y: 0, z: 10, yaw: 0, pitch: 0 };
        const bot = { x: 0, y: 0, z: -15, size: 1.5, color: "#ff4757", dir: 1 };
        
        const walls = [];
        const bullets = [];
        
        function createCubeVertices(cx, cy, cz, sx, sy, sz) {
            const hx = sx/2, hy = sy/2, hz = sz/2;
            return [
                {x: cx-hx, y: cy-hy, z: cz-hz}, {x: cx+hx, y: cy-hy, z: cz-hz},
                {x: cx+hx, y: cy+hy, z: cz-hz}, {x: cx-hx, y: cy+hy, z: cz-hz},
                {x: cx-hx, y: cy-hy, z: cz+hz}, {x: cx+hx, y: cy-hy, z: cz+hz},
                {x: cx+hx, y: cy+hy, z: cz+hz}, {x: cx-hx, y: cy+hy, z: cz+hz}
            ];
        }

        const cubeFaces = [
            [0, 1, 2, 3], [4, 5, 6, 7], [0, 1, 5, 4],
            [2, 3, 7, 6], [0, 3, 7, 4], [1, 2, 6, 5]
        ];

        // --- Standardized Key String Parsing Pipeline ---
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (k === ' ' || e.code === 'Space') { executeAction(); return; }
            if (k === '1') { activeSlot = 1; updateSlots(); return; }
            if (k === '2') { activeSlot = 2; updateSlots(); return; }
            
            // Standard tracking mapping checks
            if (k === 'w') keys['w'] = true;
            if (k === 's') keys['s'] = true;
            if (k === 'a') keys['a'] = true;
            if (k === 'd') keys['d'] = true;
            if (e.key === 'ArrowLeft') keys['arrowleft'] = true;
            if (e.key === 'ArrowRight') keys['arrowright'] = true;
            if (e.key === 'ArrowUp') keys['arrowup'] = true;
            if (e.key === 'ArrowDown') keys['arrowdown'] = true;
        });

        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w') keys['w'] = false;
            if (k === 's') keys['s'] = false;
            if (k === 'a') keys['a'] = false;
            if (k === 'd') keys['d'] = false;
            if (e.key === 'ArrowLeft') keys['arrowleft'] = false;
            if (e.key === 'ArrowRight') keys['arrowright'] = false;
            if (e.key === 'ArrowUp') keys['arrowup'] = false;
            if (e.key === 'ArrowDown') keys['arrowdown'] = false;
        });

        function updateSlots() {
            document.getElementById('slot-1').className = activeSlot === 1 ? 'slot active' : 'slot';
            document.getElementById('slot-2').className = activeSlot === 2 ? 'slot active' : 'slot';
        }

        function executeAction() {
            const sY = Math.sin(player.yaw), cY = Math.cos(player.yaw);
            if (activeSlot === 1) {
                // Spawn Projectile
                bullets.push({
                    x: player.x, y: 0.5, z: player.z,
                    vx: -sY * 0.8, vy: Math.sin(player.pitch) * 0.8, vz: -cY * 0.8
                });
            } else if (activeSlot === 2) {
                // Snap Build Structure node
                const bx = Math.round((player.x - sY * 5) / 4) * 4;
                const bz = Math.round((player.z - cY * 5) / 4) * 4;
                if (!walls.some(w => w.x === bx && w.z === bz)) {
                    walls.push({ x: bx, y: 0.5, z: bz, sx: 4, sy: 3, sz: 0.5 });
                }
            }
        }

        // --- Graphics Engine Ray Matrices Perspective Transformation ---
        function project3DPoint(worldX, worldY, worldZ) {
            const sY = Math.sin(-player.yaw), cY = Math.cos(-player.yaw);
            const camDistance = 6;
            const camHeight = 2.5;

            let rx = player.x - sY * camDistance;
            let rz = player.z + cY * camDistance;
            let ry = player.y + camHeight;

            let dx = worldX - rx;
            let dy = worldY - ry;
            let dz = worldZ - rz;

            let x1 = dx * cY - dz * sY;
            let z1 = dx * sY + dz * cY;

            const sP = Math.sin(-player.pitch), cP = Math.cos(-player.pitch);
            let y2 = dy * cP - z1 * sP;
            let z2 = dy * sP + z1 * cP;

            if (z2 <= 0.1) return null;

            const fovFactor = (canvas.width + canvas.height) / 2;
            const screenX = (x1 / z2) * fovFactor + canvas.width / 2;
            const screenY = (-y2 / z2) * fovFactor + canvas.height / 2;

            return { x: screenX, y: screenY, depth: z2 };
        }

        function draw3DObject(vertices, color, outlineColor) {
            cubeFaces.forEach(face => {
                ctx.beginPath();
                let validFace = true;
                face.forEach((vIdx, i) => {
                    const pt = project3DPoint(vertices[vIdx].x, vertices[vIdx].y, vertices[vIdx].z);
                    if (!pt) { validFace = false; return; }
                    if (i === 0) ctx.moveTo(pt.x, pt.y);
                    else ctx.lineTo(pt.x, pt.y);
                });
                if (validFace) {
                    ctx.closePath();
                    ctx.fillStyle = color;
                    ctx.fill();
                    ctx.strokeStyle = outlineColor || "rgba(255,255,255,0.2)";
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            });
        }

        // --- Core State Logic Loops ---
        function frameUpdate() {
            if (keys['arrowleft']) player.yaw += 0.04;
            if (keys['arrowright']) player.yaw -= 0.04;
            if (keys['arrowup']) player.pitch = Math.min(0.5, player.pitch + 0.03);
            if (keys['arrowdown']) player.pitch = Math.max(-0.5, player.pitch - 0.03);

            const speed = 0.15;
            const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
            if (keys['w']) { player.x -= sin * speed; player.z -= cos * speed; }
            if (keys['s']) { player.x += sin * speed; player.z += cos * speed; }
            if (keys['a']) { player.x -= cos * speed; player.z += sin * speed; }
            if (keys['d']) { player.x += cos * speed; player.z -= sin * speed; }

            bot.x += 0.06 * bot.dir;
            if (Math.abs(bot.x) > 12) bot.dir *= -1;

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx; b.y += b.vy; b.z += b.vz;
                const d = Math.hypot(b.x - bot.x, b.z - bot.z);
                if (d < bot.size && Math.abs(b.y - bot.y) < 1.5) {
                    bot.color = "#00f5d4";
                    setTimeout(() => bot.color = "#ff4757", 150);
                    bullets.splice(i, 1);
                    continue;
                }
                if (Math.hypot(b.x - player.x, b.z - player.z) > 100) bullets.splice(i, 1);
            }
        }

        function renderScene() {
            ctx.fillStyle = "#0c0c1e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Floor rendering parameters
            ctx.strokeStyle = "#1b1b3a";
            ctx.lineWidth = 1;
            const gridSize = 40, spacing = 4;
            for (let i = -gridSize; i <= gridSize; i += spacing) {
                ctx.beginPath();
                for (let z = -gridSize; z <= gridSize; z += 2) {
                    const pt = project3DPoint(i, -1, z);
                    if (pt) { if (z === -gridSize) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y); }
                }
                ctx.stroke();

                ctx.beginPath();
                for (let x = -gridSize; x <= gridSize; x += 2) {
                    const pt = project3DPoint(x, -1, i);
                    if (pt) { if (x === -gridSize) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y); }
                }
                ctx.stroke();
            }

            // Draw Entities
            draw3DObject(createCubeVertices(bot.x, 0.5, bot.z, bot.size, 2, bot.size), bot.color, "#ffffff");
            walls.forEach(w => draw3DObject(createCubeVertices(w.x, w.y, w.z, w.sx, w.sy, w.sz), "#2a3dac", "#4d62e0"));

            if (activeSlot === 2) {
                const sY = Math.sin(player.yaw), cY = Math.cos(player.yaw);
                const bx = Math.round((player.x - sY * 5) / 4) * 4;
                const bz = Math.round((player.z - cY * 5) / 4) * 4;
                draw3DObject(createCubeVertices(bx, 0.5, bz, 4, 3, 0.5), "rgba(0, 245, 212, 0.1)", "#00f5d4");
            }

            bullets.forEach(b => {
                const pt = project3DPoint(b.x, b.y, b.z);
                if (pt) {
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, Math.max(2, 10 / pt.depth), 0, Math.PI * 2);
                    ctx.fillStyle = "#00f5d4";
                    ctx.fill();
                }
            });

            // Reticle Frame Highlight Target
            ctx.strokeStyle = "#00f5d4";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(canvas.width/2, canvas.height/2, 6, 0, Math.PI*2);
            ctx.stroke();
        }

        function engineLoop() {
            frameUpdate();
            renderScene();
            requestAnimationFrame(engineLoop);
        }

        engineLoop();
    </script>
</body>
</html>
