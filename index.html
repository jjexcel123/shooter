<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immediate 1v1 3D Sandbox</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #050510; }
        #hud { position: absolute; top: 10px; left: 10px; color: white; background: rgba(10,10,25,0.85); padding: 15px; border-radius: 6px; border: 1px solid #00ffff; pointer-events: none; z-index: 10; }
        #hotbar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10; }
        .slot { width: 80px; height: 65px; background: rgba(20,20,40,0.9); border: 2px solid #444; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #888; font-size: 11px; font-weight: bold; }
        .slot.active { border-color: #00ffff; color: #fff; background: rgba(0,255,255,0.2); }
    </style>
    <!-- Load Three.js Core Engine -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="hud">
        <h3 style="margin:0 0 8px 0; color:#00ffff;">3D Arena Sandbox</h3>
        <b>[WASD]</b> Move Player<br>
        <b>[Left/Right Arrow]</b> Turn Camera<br>
        <b>[Up/Down Arrow]</b> Aim Up/Down<br>
        <b>[1]</b> Gun Mode &nbsp;|&nbsp; <b>[2]</b> Wall Mode<br>
        <b>[SPACE]</b> Shoot Bullet / Place Wall
    </div>

    <div id="hotbar">
        <div class="slot active" id="slot-1"><span>🔫</span><br>GUN (1)</div>
        <div class="slot" id="slot-2"><span>🧱</span><br>WALL (2)</div>
    </div>

    <script>
        // 1. Scene Engine Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Lighting & Floor Grid
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const sun = new THREE.DirectionalLight(0xffffff, 0.5);
        sun.position.set(10, 30, 10);
        scene.add(sun);

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x111424 }));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const grid = new THREE.GridHelper(200, 50, 0x00ffff, 0x222538);
        grid.position.y = 0.01;
        scene.add(grid);

        // 3. Player Setup (Bright Cyan Capsule Box)
        const player = new THREE.Group();
        scene.add(player);
        player.position.set(0, 0, 10);

        const pMesh = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2, 1.2), new THREE.MeshStandardMaterial({ color: 0x00d2d3 }));
        pMesh.position.y = 1;
        player.add(pMesh);

        // 4. Enemy Bot Setup (Red Capsule Box)
        const bot = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2, 1.2), new THREE.MeshStandardMaterial({ color: 0xff4757 }));
        bot.position.set(0, 1, -15);
        scene.add(bot);

        // 5. Input System State
        const keys = {};
        let yaw = 0;   // Left/Right rotation
        let pitch = 0; // Up/Down tracking
        let activeSlot = 1; 

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.key === '1') switchSlot(1);
            if (e.key === '2') switchSlot(2);
            
            // Fire trigger mapped safely to Spacebar
            if (e.code === 'Space') {
                executeAction();
            }
        });
        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        function switchSlot(num) {
            activeSlot = num;
            document.getElementById('slot-1').className = num === 1 ? 'slot active' : 'slot';
            document.getElementById('slot-2').className = num === 2 ? 'slot active' : 'slot';
        }

        // 6. Projectiles and Structure Containers
        const bullets = [];
        const ghostWall = new THREE.Mesh(new THREE.BoxGeometry(4, 3, 0.4), new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true }));
        scene.add(ghostWall);

        function executeAction() {
            if (activeSlot === 1) {
                // Fire Bullets Directly Forward
                const b = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), new THREE.MeshBasicMaterial({ color: 0x00ffff }));
                b.position.copy(player.position).y += 1.3;
                
                // Project direction vector from internal camera matrices
                const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                b.velocity = dir.multiplyScalar(1.2);
                scene.add(b);
                bullets.push(b);
            } else if (activeSlot === 2) {
                // Build Solid Structure Node
                const w = new THREE.Mesh(new THREE.BoxGeometry(4, 3, 0.4), new THREE.MeshStandardMaterial({ color: 0x3f51b5 }));
                w.position.copy(ghostWall.position);
                w.rotation.copy(ghostWall.rotation);
                scene.add(w);
            }
        }

        // 7. Engine Game Loop Execution
        function animate() {
            requestAnimationFrame(animate);

            // Turn player/camera using Left and Right arrow keys
            if (keys['ArrowLeft']) yaw += 0.04;
            if (keys['ArrowRight']) yaw -= 0.04;
            
            // Look up/down using Up and Down arrow keys
            if (keys['ArrowUp']) pitch = Math.min(0.6, pitch + 0.03);
            if (keys['ArrowDown']) pitch = Math.max(-0.6, pitch - 0.03);

            player.rotation.y = yaw;

            // Move player relative to facing direction
            const speed = 0.15;
            if (keys['KeyW']) { player.position.x -= Math.sin(yaw) * speed; player.position.z -= Math.cos(yaw) * speed; }
            if (keys['KeyS']) { player.position.x += Math.sin(yaw) * speed; player.position.z += Math.cos(yaw) * speed; }
            if (keys['KeyA']) { player.position.x -= Math.cos(yaw) * speed; player.position.z += Math.sin(yaw) * speed; }
            if (keys['KeyD']) { player.position.x += Math.cos(yaw) * speed; player.position.z -= Math.cos(yaw) * speed; }

            // Behind-the-shoulder camera positioning matrix
            const camOffset = new THREE.Vector3(0, 2.5, 5.5).applyQuaternion(player.quaternion);
            camera.position.copy(player.position).add(camOffset);

            // Compute focus target coordinates ahead of player
            const lookTarget = new THREE.Vector3(0, 1.3, -15).applyQuaternion(player.quaternion).add(player.position);
            lookTarget.y += pitch * 10;
            camera.lookAt(lookTarget);

            // Dynamic grid wall blueprint builder snappings
            if (activeSlot === 2) {
                ghostWall.visible = true;
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion);
                const buildPoint = new THREE.Vector3().copy(player.position).addScaledVector(forward, 6);
                
                const snapX = Math.round(buildPoint.x / 4) * 4;
                const snapZ = Math.round(buildPoint.z / 4) * 4;
                ghostWall.position.set(snapX, 1.5, snapZ);
                ghostWall.rotation.y = Math.round(yaw / (Math.PI / 2)) * (Math.PI / 2);
            } else {
                ghostWall.visible = false;
            }

            // Update weapon projectile trajectories
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.position.add(b.velocity);
                
                // Simple hit detection tracking vs the red target bot
                if (b.position.distanceTo(bot.position) < 1.5) {
                    bot.material.color.setHex(Math.random() * 0xffffff); // Bot flashes random color when hit
                    scene.remove(b);
                    bullets.splice(i, 1);
                    continue;
                }
                
                // Cleanup out of bounds projectiles
                if (b.position.length() > 150) {
                    scene.remove(b);
                    bullets.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
