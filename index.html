<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Offline 3D 1v1 Arena</title>
    <style>
        body { margin: 0; overflow: hidden; background: #060610; font-family: sans-serif; color: white; user-select: none; }
        #hud { position: absolute; top: 15px; left: 15px; background: rgba(15,15,30,0.9); padding: 15px; border-radius: 6px; border: 2px solid #00f5d4; pointer-events: none; line-height: 1.4; font-size: 13px; }
        #hotbar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
        .slot { width: 75px; height: 60px; background: rgba(20,20,40,0.9); border: 2px solid #444; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #888; }
        .slot.active { border-color: #00f5d4; color: #fff; background: rgba(0,245,212,0.15); }
    </style>
</head>
<body>

    <div id="hud">
        <h3 style="margin:0 0 6px 0; color:#00f5d4;">Pure 3D Sandbox</h3>
        <b>[W, A, S, D]</b> Walk Around<br>
        <b>[Left / Right Arrow]</b> Spin Camera<br>
        <b>[Up / Down Arrow]</b> Look Up / Down<br>
        <b>[1]</b> Gun Mode &nbsp;|&nbsp; <b>[2]</b> Wall Mode<br>
        <b>[SPACEBAR]</b> Shoot Bullet / Build Wall
    </div>

    <div id="hotbar">
        <div class="slot active" id="slot-1"><span>🔫</span><br>GUN (1)</div>
        <div class="slot" id="slot-2"><span>🧱</span><br>WALL (2)</div>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const ctx = canvas.getContext("2d");

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Game World Variables ---
        let activeSlot = 1;
        const keys = {};
        
        // Coordinates and Camera matrix
        const player = { x: 0, y: 0, z: 10, yaw: 0, pitch: 0 };
        const bot = { x: 0, y: 0, z: -15, size: 1.5, color: "#ff4757", dir: 1 };
        
        const walls = [];
        const bullets = [];
        
        // Standard geometric layouts for building block boxes
        function createCubeVertices(cx, cy, cz, sx, sy, sz) {
            const hx = sx/2, hy = sy/2, hz = sz/2;
            return [
                {x: cx-hx, y: cy-hy, z: cz-hz}, {x: cx+hx, y: cy-hy, z: cz-hz},
                {x: cx+hx, y: cy+hy, z: cz-hz}, {x: cx-hx, y: cy+hy, z: cz-hz},
                {x: cx-hx, y: cy-hy, z: cz+hz}, {x: cx+hx, y: cy-hy, z: cz+hz},
                {x: cx+hx, y: cy+hy, z: cz+hz}, {x: cx-hx, y: cy+hy, z: cz+hz}
            ];
        }

        const cubeFaces = [
            [0, 1, 2, 3], [5, 4, 7, 6], [4, 0, 3, 7],
            [1, 5, 6, 2], [4, 5, 1, 0], [3, 2, 6, 7]
        ];

        // --- Input Event Bindings ---
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.key === '1') { activeSlot = 1; updateSlots(); }
            if (e.key === '2') { activeSlot = 2; updateSlots(); }
            if (e.code === 'Space') executeAction();
        });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        function updateSlots() {
            document.getElementById('slot-1').className = activeSlot === 1 ? 'slot active' : 'slot';
            document.getElementById('slot-2').className = activeSlot === 2 ? 'slot active' : 'slot';
        }

        function executeAction() {
            // Project vectors out from player alignment angles configurations
            const sY = Math.sin(player.yaw), cY = Math.cos(player.yaw);
            if (activeSlot === 1) {
                // Shoot Projectile 3D sphere point
                bullets.push({
                    x: player.x, y: 0.5, z: player.z,
                    vx: -sY * 0.8, vy: Math.sin(player.pitch) * 0.8, vz: -cY * 0.8
                });
            } else if (activeSlot === 2) {
                // Snap structure block directly in front of face direction
                const bx = Math.round((player.x - sY * 5) / 4) * 4;
                const bz = Math.round((player.z - cY * 5) / 4) * 4;
                
                // Block duplication prevent step
                if (!walls.some(w => w.x === bx && w.z === bz)) {
                    walls.push({ x: bx, y: 0.5, z: bz, sx: 4, sy: 3, sz: 0.5 });
                }
            }
        }

        // --- Mathematics: Transform 3D Points into 2D Screen Spaces ---
        function project3DPoint(worldX, worldY, worldZ) {
            // 1. Translate relative position coordinates to behind-player camera view tracking offsets
            const sY = Math.sin(-player.yaw), cY = Math.cos(-player.yaw);
            const camDistance = 6;
            const camHeight = 2.5;

            let rx = player.x - sY * camDistance;
            let rz = player.z + cY * camDistance;
            let ry = player.y + camHeight;

            let dx = worldX - rx;
            let dy = worldY - ry;
            let dz = worldZ - rz;

            // 2. Compute Yaw Rotation Matrices configurations
            let x1 = dx * cY - dz * sY;
            let z1 = dx * sY + dz * cY;

            // 3. Compute Pitch Rotation Matrices configurations
            const sP = Math.sin(-player.pitch), cP = Math.cos(-player.pitch);
            let y2 = dy * cP - z1 * sP;
            let z2 = dy * sP + z1 * cP;

            // Don't render points sitting behind camera viewport boundaries plane
            if (z2 <= 0.1) return null;

            // 4. Perspective Divide mapping values onto canvas scale ranges
            const fovFactor = (canvas.width + canvas.height) / 2;
            const screenX = (x1 / z2) * fovFactor + canvas.width / 2;
            const screenY = (-y2 / z2) * fovFactor + canvas.height / 2;

            return { x: screenX, y: screenY, depth: z2 };
        }

        // Render solid geometric shapes with basic back-to-front depth sort layering
        function draw3DObject(vertices, color, outlineColor) {
            cubeFaces.forEach(face => {
                ctx.beginPath();
                let validFace = true;
                
                face.forEach((vIdx, i) => {
                    const pt = project3DPoint(vertices[vIdx].x, vertices[vIdx].y, vertices[vIdx].z);
                    if (!pt) { validFace = false; return; }
                    if (i === 0) ctx.moveTo(pt.x, pt.y);
                    else ctx.lineTo(pt.x, pt.y);
                });

                if (validFace) {
                    ctx.closePath();
                    ctx.fillStyle = color;
                    ctx.fill();
                    ctx.strokeStyle = outlineColor || "rgba(255,255,255,0.2)";
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            });
        }

        // --- Core Engine Processing Loop Loops ---
        function frameUpdate() {
            // Look controls via arrow keys mapping offsets configurations
            if (keys['ArrowLeft']) player.yaw += 0.04;
            if (keys['ArrowRight']) player.yaw -= 0.04;
            if (keys['ArrowUp']) player.pitch = Math.min(0.5, player.pitch + 0.03);
            if (keys['ArrowDown']) player.pitch = Math.max(-0.5, player.pitch - 0.03);

            // Movement relative to facing direction
            const speed = 0.15;
            const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
            if (keys['KeyW']) { player.x -= sin * speed; player.z -= cos * speed; }
            if (keys['KeyS']) { player.x += sin * speed; player.z += cos * speed; }
            if (keys['KeyA']) { player.x -= cos * speed; player.z += sin * speed; }
            if (keys['KeyD']) { player.x += cos * speed; player.z -= sin * speed; }

            // Bot movement ping-pong pattern
            bot.x += 0.06 * bot.dir;
            if (Math.abs(bot.x) > 10) bot.dir *= -1;

            // Projectiles mechanics path updates
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx; b.y += b.vy; b.z += b.vz;

                // Simple collision test tracking vs enemy bot box matrix bounds
                const d = Math.hypot(b.x - bot.x, b.z - bot.z);
                if (d < bot.size && Math.abs(b.y - bot.y) < 1.5) {
                    bot.color = "#00f5d4"; // Flash green on weapon impact registration
                    setTimeout(() => bot.color = "#ff4757", 150);
                    bullets.splice(i, 1);
                    continue;
                }
                // Out of range wipe cleanup cycle 
                if (Math.hypot(b.x - player.x, b.z - player.z) > 100) bullets.splice(i, 1);
            }
        }

        function renderScene() {
            ctx.fillStyle = "#0c0c1e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. Draw 3D Arena Floor Grid Matrix Accent System
            ctx.strokeStyle = "#1b1b3a";
            ctx.lineWidth = 1;
            const gridSize = 40, spacing = 4;
            for (let i = -gridSize; i <= gridSize; i += spacing) {
                // Cross directional infinite alignment projection mappings lines
                ctx.beginPath();
                for (let z = -gridSize; z <= gridSize; z += 2) {
                    const pt = project3DPoint(i, -1, z);
                    if (pt) { if (z === -gridSize) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y); }
                }
                ctx.stroke();

                ctx.beginPath();
                for (let x = -gridSize; x <= gridSize; x += 2) {
                    const pt = project3DPoint(x, -1, i);
                    if (pt) { if (x === -gridSize) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y); }
                }
                ctx.stroke();
            }

            // 2. Draw Target Bot Box Structure
            const botVerts = createCubeVertices(bot.x, 0.5, bot.z, bot.size, 2, bot.size);
            draw3DObject(botVerts, bot.color, "#ffffff");

            // 3. Draw User Placed Architecture Modular Walls Setup
            walls.forEach(w => {
                const wallVerts = createCubeVertices(w.x, w.y, w.z, w.sx, w.sy, w.sz);
                draw3DObject(wallVerts, "#2a3dac", "#4d62e0");
            });

            // 4. Draw Blueprint Placement Outline if in Build Mode
            if (activeSlot === 2) {
                const sY = Math.sin(player.yaw), cY = Math.cos(player.yaw);
                const bx = Math.round((player.x - sY * 5) / 4) * 4;
                const bz = Math.round((player.z - cY * 5) / 4) * 4;
                const ghostVerts = createCubeVertices(bx, 0.5, bz, 4, 3, 0.5);
                draw3DObject(ghostVerts, "rgba(0, 245, 212, 0.1)", "#00f5d4");
            }

            // 5. Render Flying Projectiles Particles Dots
            bullets.forEach(b => {
                const pt = project3DPoint(b.x, b.y, b.z);
                if (pt) {
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, Math.max(2, 10 / pt.depth), 0, Math.PI * 2);
                    ctx.fillStyle = "#00f5d4";
                    ctx.fill();
                    ctx.closePath();
                }
            });

            // 6. Center Pointer Reticle Overlay configuration target
            ctx.strokeStyle = "#00f5d4";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(canvas.width/2, canvas.height/2, 6, 0, Math.PI*2);
            ctx.stroke();
        }

        function engineLoop() {
            frameUpdate();
            renderScene();
            requestAnimationFrame(engineLoop);
        }

        // Kick off engine loops natively without blocking layers hooks
        engineLoop();
    </script>
</body>
</html>
